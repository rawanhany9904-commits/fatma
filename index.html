<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatma</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo',sans-serif;background:linear-gradient(160deg,#ffffff 0%,#e4f0fb 55%,#ffe8d0 100%);display:flex;align-items:center;justify-content:center}
.star{position:fixed;pointer-events:none;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.35) rotate(15deg);opacity:.5}}

.stage{display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .8s,transform .8s}
.stage.gone{opacity:0;transform:scale(.9);pointer-events:none}
.env{position:relative;width:min(82vw,340px);height:min(56vw,232px);cursor:pointer;perspective:900px;filter:drop-shadow(0 14px 22px rgba(31,95,168,.25))}
.back{position:absolute;inset:0;background:#e8740c;border-radius:8px}
.paper{position:absolute;left:7%;right:7%;top:8%;height:82%;background:#fff;border-radius:4px;transition:transform .9s .7s}
.env.open .paper{transform:translateY(-38%)}
.pocket{position:absolute;inset:0;background:#f7a54f;border-radius:8px;clip-path:polygon(0 0,0 100%,100% 100%,100% 0,50% 56%);z-index:3}
.flap{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:4;transform-style:preserve-3d}
.flap div{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{background:#ff9a2e}
.fb{background:#1f5fa8;transform:rotateX(180deg);display:flex;justify-content:center;padding-top:14%;color:#fff;font-size:1.6rem}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:56%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#fff;border:3px solid #1f5fa8;color:#1f5fa8;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;z-index:6;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:opacity .4s,transform .4s}
.env.open .seal{opacity:0;transform:scale(.5)}
.hint{font-size:.85rem;color:#1f5fa8;opacity:.8;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

.letter{position:fixed;display:flex;width:min(94vw,760px);height:min(80vh,540px);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 50px rgba(18,58,102,.35);opacity:0;visibility:hidden;transform:scale(.9) translateY(20px);transition:opacity 1s,transform 1s,visibility 1s;background:#fff}
.letter.show{opacity:1;visibility:visible;transform:none}

.txt{flex:1.5;position:relative;background:radial-gradient(circle at 80% 20%,#fff 0%,#f0f5fd 100%);display:flex;flex-direction:column;justify-content:center;padding:32px 36px 32px 24px}
.heart{font-size:1.4rem;margin-bottom:8px}
.name{font-size:1.5rem;font-weight:700;color:#e8740c;margin-bottom:12px}
.body-txt{font-size:1.05rem;line-height:1.9;color:#18406d;font-weight:600;text-align:justify}

.img-wrap{flex:1;background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);display:flex;align-items:center;justify-content:center;padding:20px;border-left:1px solid #fed7aa}
.badge-container{width:140px;height:140px;filter:drop-shadow(0 10px 15px rgba(234,88,12,.2));transition:transform .3s ease}
.badge-container:hover{transform:scale(1.05) rotate(2deg)}

@media(max-width:650px){
  .letter{flex-direction:column-reverse;height:auto;max-height:85vh;overflow-y:auto}
  .img-wrap{height:160px;flex:none;width:100%;border-left:none;border-bottom:1px solid #fed7aa}
  .badge-container{width:110px;height:110px}
  .txt{padding:24px 20px}
  .body-txt{font-size:.98rem;line-height:1.8}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="env" id="env" onclick="openEnv()">
    <div class="back"></div>
    <div class="paper"></div>
    <div class="pocket"></div>
    <div class="flap">
      <div class="ff"></div>
      <div class="fb">♥</div>
    </div>
    <div class="seal">Fatma</div>
  </div>
  <div class="hint">اضغطي لفتحه</div>
</div>

<div class="letter" id="letter">
  <div class="txt">
    <div class="heart">🧡</div>
    <div class="name">فاطمة</div>
    <div class="body-txt">
      فاطمة الرقيقة الجميلة وشريكتي في حب القطط.. حقيقي من أكثر المسؤولين اللي الشغل معاهم هادي ومريح، وشكراً لكل مجهودك ومحاولاتك، وإن شاء الله الخطوات الجاية تكون أحسن، وربنا يوفقك إن شاء الله. ✨
    </div>
  </div>

  <div class="img-wrap">
    <div class="badge-container">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <path d="M75,135 L50,190 L75,175 L100,190 L88,135 Z" fill="#06b6d4" />
        <path d="M125,135 L100,190 L125,175 L150,190 L138,135 Z" fill="#0891b2" />
        <circle cx="100" cy="90" r="65" fill="#ea580c" />
        <circle cx="100" cy="90" r="58" fill="#f97316" />
        <circle cx="100" cy="90" r="50" fill="#fbbf24" />
        <text x="100" y="80" text-anchor="middle" fill="#0f172a" font-family="'Cairo', sans-serif" font-weight="900" font-size="22">GREAT</text>
        <text x="100" y="108" text-anchor="middle" fill="#0f172a" font-family="'Cairo', sans-serif" font-weight="900" font-size="26">JOB!</text>
      </svg>
    </div>
  </div>
</div>

<script>
const colors=['#1f5fa8','#f7a54f','#e8740c','#3b82f6','#f97316'];
for(let i=0;i<26;i++){
  const s=document.createElement('div');
  s.className='star';
  s.textContent='✦';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.color=colors[Math.floor(Math.random()*colors.length)];
  s.style.fontSize=(10+Math.random()*14)+'px';
  s.style.animationDelay=(Math.random()*3)+'s';
  document.body.appendChild(s);
}

function openEnv(){
  const env=document.getElementById('env');
  const stage=document.getElementById('stage');
  const letter=document.getElementById('letter');
  if(env.classList.contains('open')) return;
  env.classList.add('open');
  setTimeout(()=>{
    stage.classList.add('gone');
    setTimeout(()=>{
      stage.style.display='none';
      letter.classList.add('show');
    },700);
  },1200);
}
</script>
</body>
</html>
